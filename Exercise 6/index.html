<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Visualisations - Energy & Star Ratings</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/visualisation.css">
</head>
<body>
  <header>
    <h1>TV Energy Consumption & Performance</h1>
    <p>Exploring energy consumption frequency and its relationship with star ratings across screen technologies.</p>
  </header>

  <main>
    <!-- Histogram Section (Exercise 6.1 & 6.2) -->
    <section class="chart-section">
      <h2>Energy Consumption Distribution</h2>
      <div id="filters_screen" class="filter-group"></div>
      <div id="histogram-container" class="chart-container">
        <div id="histogram"></div>
      </div>
    </section>

    <!-- Scatterplot Section (Exercise 6.3) -->
    <section class="chart-section">
      <h2>Energy Consumption vs. Star Rating</h2>
      <div id="filters_scatter" class="filter-group"></div>
      <div id="scatterplot-container" class="chart-container">
        <div id="scatterplot" class="responsive-svg-container"></div>
      </div>
    </section>
  </main>

  <!-- External Libraries -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Application Scripts -->
  <script src="js/shared-constants.js"></script>
  <script src="js/histogram.js"></script>
  <script src="js/scatterplot.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/load-data.js"></script>
</body>
</html>
